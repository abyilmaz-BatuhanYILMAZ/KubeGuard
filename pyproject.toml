[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeguard-static"
version = "0.1.0"
description = "Educational, read-only Kubernetes YAML security analyzer"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["PyYAML>=6.0.1,<7"]

[project.scripts]
kubeguard = "kubeguard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
