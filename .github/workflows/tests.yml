name: KubeGuard tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q src
      - run: python -m kubeguard scan examples/secure-pod.yaml
      - name: Assert insecure example produces a failing scan
        run: |
          if python -m kubeguard scan examples/insecure-pod.yaml; then
            echo 'Unexpected clean scan' >&2
            exit 1
          fi
