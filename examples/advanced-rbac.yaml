# Deliberately risky, offline-only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: unsafe-delegation}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [escalate, bind]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: unsafe-group-binding}
subjects:
  - kind: Group
    name: system:authenticated
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: unsafe-delegation
  apiGroup: rbac.authorization.k8s.io
