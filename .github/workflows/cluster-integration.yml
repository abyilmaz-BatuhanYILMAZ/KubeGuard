name: Read-only KubeGuard live-cluster smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/kubeguard/**"
      - "tests/test_cluster.py"
      - ".github/workflows/cluster-integration.yml"

permissions:
  contents: read

jobs:
  kind-cluster-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python package and run scanner tests
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -v
      - name: Install kubectl and kind
        uses: helm/kind-action@v1.14.0
        with:
          install_only: true
      - name: Create disposable test cluster and a deliberately broad unbound Role
        run: |
          kind create cluster --name kubeguard-ci --wait 120s
          kubectl --context kind-kubeguard-ci create namespace kubeguard-ci
          kubectl --context kind-kubeguard-ci -n kubeguard-ci create role broad-example-unbound --verb='*' --resource=configmaps
      - name: Scan the real Kubernetes API and confirm finding
        run: |
          kubeguard scan --cluster --context kind-kubeguard-ci --format json --fail-on NONE > /tmp/live-kubeguard.json
          python - <<'PY'
          import json
          report=json.load(open('/tmp/live-kubeguard.json',encoding='utf-8'))
          targets=[f for f in report["findings"] if f["rule_id"] == "KG012" and f["resource"] == "Role/kubeguard-ci/broad-example-unbound"]
          assert targets, "Expected live RBAC rule finding missing"
          assert report["documents_scanned"] > 0, "No Kubernetes resources were inventoried"
          print("PASS: live cluster inventory detected unbound wildcard Role")
          PY
      - name: Diagnostics if scan failed
        if: failure()
        run: |
          kubectl --context kind-kubeguard-ci get roles -A || true
      - name: Remove disposable cluster
        if: always()
        run: |
          if kind get clusters 2>/dev/null | grep -qx kubeguard-ci; then
            kind delete cluster --name kubeguard-ci
          fi
